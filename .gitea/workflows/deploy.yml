name: Deploy Quartz to Codeberg Pages

on:
  push:
    branches:
      - v4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Quartz
        run: npx quartz build

      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://kryptonick.codeberg.page/the-gloaming-wiki/"
          token: ${{ forge.token }}
          source: public/
